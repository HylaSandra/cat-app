<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat App</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header>
    <h1>Cat App</h1>
    <nav>
      <ul>
        <li><a href="index.html">Strona główna</a></li>
        <li><a href="register.html">Zarejestruj kota</a></li>
        <li><a href="random-cat.html">Losowy kot</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Witaj w Cat App!</h2>
      <p>To aplikacja, w której możesz rejestrować swoje koty i oglądać losowe zdjęcia innych kotów z internetu!</p>
    </section>
  </main>

  <footer>
    <p>2025 SH</p>
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('Service Worker zarejestrowany!'))
        .catch(err => console.error('Błąd Service Workera:', err));
    }
  </script>
</body>
</html>
